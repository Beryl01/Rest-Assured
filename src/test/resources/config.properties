# Test Configuration Properties
# Customize these values for your environment

# API Configuration
api.base.url=https://api.example.com
api.base.path=/api/v1

# Test Environment (dev, staging, prod)
test.environment=staging

# Timeout settings (milliseconds)
test.timeout.response=5000
test.timeout.connection=3000

# Logging
logging.level=INFO
logging.enable.request=true
logging.enable.response=true

# Retry Configuration
test.retry.count=3
test.retry.delay=1000

# SSL/TLS Settings
ssl.verify=true
proxy.enabled=false

# Authentication
auth.username=testuser
auth.password=testpass123
auth.token.endpoint=/auth/login
auth.token.expiry=3600

# Email Notifications (for Jenkins)
email.enabled=true
email.recipients=qa-team@company.com
email.on.failure=true
email.on.success=false

# Parallel Execution
test.parallel=false
test.thread.count=1
